# Dependabot configuration for crossterm-kotlin.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Covers three ecosystems present in this repo:
#
#   1. Gradle — kotlin-multiplatform plugin, kotlin-serialization plugin,
#      android-kotlin-multiplatform-library plugin, vanniktech maven-publish,
#      and the kotlinx-{coroutines,serialization,datetime,collections-immutable}
#      runtime dependencies declared in build.gradle.kts.
#
#   2. GitHub Actions — the actions pinned across the workflow files in
#      .github/workflows/. Versions are not enumerated here: Dependabot reads
#      them straight from the workflow files, and a hand-kept list in this
#      comment would silently drift from the actual pins.
#
#   3. npm — configured but with all updates ignored (open-pull-requests-limit: 0
#      and ignore: "*" for all update types). This prevents Dependabot from
#      attempting to create security updates for vendored npm dependencies in
#      kotlin-js-store/ and gradle/npm/, which are workspace-template-managed
#      and should not be updated independently. This configuration stops
#      "security_update_not_possible" errors while still allowing Dependabot to
#      track the dependency graph for security alerts.

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
